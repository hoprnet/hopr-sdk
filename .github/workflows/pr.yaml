name: PR

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true

jobs:
  build:
    name: Build
    strategy:
      matrix:
        node_version:
          - 22.x
          - 24.x
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      node_version: ${{ matrix.node_version }}

  publish:
    name: Publish
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish.yaml
    with:
      version_type: commit
      # Fork PRs get no secrets or OIDC token, so nothing is published for them.
      enabled: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset.
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - build
      - publish
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # Publishing is input-skipped for fork PRs.
          allowed-skips: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'publish' || '' }}
